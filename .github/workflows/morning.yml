name: morning

# 아침 자동 실행 — 화~토 08:40(한국 시각)에 전날 미국 종가를 받아 하루 점검을 돌리고 기록을 저장소에 남긴다.
on:
  schedule:
    - cron: "40 23 * * 1-5"   # 화~토 08:40 KST
    - cron: "17 0 * * 2-6"    # 화~토 09:17 KST — 앞 예약을 GitHub 이 놓쳤을 때(같은 날 두 번 돌면 morning.py 가 건너뜀)
  workflow_dispatch:
    inputs:
      date:
        description: "점검할 날 (YYYY-MM-DD, 비우면 전날)"
        required: false

permissions:
  contents: write
  issues: write

concurrency: morning

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy yfinance anthropic
      - name: 하루 점검
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -X utf8 agent/morning.py ${{ inputs.date }}
      - name: 기록 남기기
        run: |
          git config user.name "Team MVPY-KIC"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add agent/runs_auto
          git diff --cached --quiet || git commit -m "아침 자동 실행 기록"
          git push
      - name: 급락일이면 알림 글
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 agent/alert.py ${{ inputs.date }}
